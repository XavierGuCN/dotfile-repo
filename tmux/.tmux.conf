# General
set -g default-terminal "tmux-256color"
# ^ the above setting cannot be used in CentOS7, use the following one
# set -g default-terminal "screen-256color"
set -g base-index 1
set -g pane-base-index 1
set -g renumber-windows on
set -g mouse on

# Copy mode
set-window-option -g mode-keys vi
bind-key -T copy-mode-vi v send-keys -X begin-selection
bind-key -T copy-mode-vi C-v send-keys -X rectangle-toggle
bind-key -T copy-mode-vi y send-keys -X copy-selection-and-cancel

# Keymaps
unbind C-b
set -g prefix C-a
bind-key C-a send-prefix

# Plugins
set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'tmux-plugins/tmux-sensible'
set -g @plugin 'christoomey/vim-tmux-navigator'
set -g @plugin 'tmux-plugins/tmux-yank'
set -g @plugin 'jimeh/tmuxifier'
set -g @plugin 'catppuccin/tmux'

# Theme: support both old and new option names
set -g @catppuccin_flavor "mocha"
set -g @catppuccin_flavour "mocha"

# Display window names
set -g @catppuccin_window_text " #W"
set -g @catppuccin_window_default_text " #W"
set -g @catppuccin_window_current_text " #W"

# Initialize TPM last
run 'env PATH="$HOME/.local/bin:$PATH" LD_LIBRARY_PATH="$HOME/.local/lib${LD_LIBRARY_PATH:+:$LD_LIBRARY_PATH}" "$HOME/.tmux/plugins/tpm/tpm"'

# Status Bar Setting
set -g status-left-length 40
set -g status-left "#[fg=#cba6f7,bg=#1e1e2e,bold] #S #[default] "
set -g status-left-style "bg=#1e1e2e"

# 在窗格顶部显示编号和标题
set -g pane-border-status top
set -g pane-border-format ' #{pane_index}: #{pane_title} '

# 前缀键 + 大写 P：重命名当前 pane
bind-key P command-prompt -p "Pane title:" "select-pane -T '%%'"